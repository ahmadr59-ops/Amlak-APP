<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15243F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="املاک">
<title>املاک — دفتر اجاره</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:'Vazirmatn';src:url('Vazirmatn.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Lalezar';src:url('Lalezar.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
:root{
  --ink:#15243F;--ink2:#22395F;--brass:#B8903F;--brass-l:#F4EAD3;
  --paper:#F2F3F5;--card:#FFFFFF;--line:#E2E5EB;--t1:#16202E;--t2:#56617A;--t3:#8C95A8;
  --ok:#1E8A5A;--ok-l:#E2F2E9;--late:#B5412E;--late-l:#F8E4DF;--warn:#A86E14;--warn-l:#FAEFD9;
  --pri:#15243F;--pri-t:#fff;--r1:18px;--r2:12px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)
}
html[data-theme="dark"]{
  --paper:#0C1321;--card:#152036;--line:#243251;--t1:#E7ECF4;--t2:#A4AEC3;--t3:#6B7690;
  --ok:#43C084;--ok-l:#12301F;--late:#EE7A64;--late-l:#3A1812;--warn:#E6A74A;--warn-l:#35260D;
  --brass-l:#2E2612;--pri:#C9A24E;--pri-t:#141B2A
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{font-family:'Vazirmatn',system-ui,sans-serif;color:var(--t1);background:var(--paper);min-height:100vh;font-size:15px;line-height:1.6;
  padding-bottom:calc(84px + var(--sb));-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.hdr{background:var(--ink);color:#fff;padding:calc(14px + var(--st)) 18px 20px;display:flex;align-items:center;gap:12px;
  border-bottom:3px solid var(--brass)}
html[data-theme="dark"] .hdr{background:#0A1222}
.hdr img{width:40px;height:40px;border-radius:11px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hdr h1{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400;font-size:27px;line-height:1;letter-spacing:.5px;
  background:linear-gradient(180deg,#FFE9A8,#F0C75E 50%,#C9962E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr p{font-size:12.5px;opacity:.72;margin-top:3px}
.hdr .sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8}

main{max-width:560px;margin:0 auto;padding:0 16px}
.sec{font-size:13.5px;font-weight:800;color:var(--t2);margin:22px 2px 10px}
.sec.m0{margin:0}
.dim{color:var(--t3);font-size:12.5px}
.calm{color:var(--t3);font-size:13.5px;padding:14px 4px}
.note{font-size:12.5px;color:var(--t3);margin:8px 2px 0;line-height:1.8}

/* hero: the ledger balance */
.hero{margin-top:18px;background:var(--card);border-radius:var(--r1);padding:20px 20px 16px;border:1px solid var(--line)}
.hero-l{font-size:13px;color:var(--t2);font-weight:600}
.hero-n{font-size:38px;font-weight:800;letter-spacing:-.5px;line-height:1.25;font-variant-numeric:tabular-nums}
.hero-n small{font-size:14px;font-weight:600;color:var(--t3);margin-right:6px}
.hero-n.is-late{color:var(--late)}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:14px 0 8px}
.meter span{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .5s}
.hero-s{font-size:12.5px;color:var(--t2)}.hero-s b{color:var(--t1)}

/* rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:right}
.row:last-child{border-bottom:0}.row.tap{cursor:pointer}.row.col{flex-direction:column;align-items:stretch}
.rtop{display:flex;align-items:flex-start;gap:11px}
.rb{flex:1;min-width:0}.rb b{display:block;font-size:14px;font-weight:700}.rb small{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.ri{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.r-late{background:var(--late-l);color:var(--late)}.r-up{background:var(--warn-l);color:var(--warn)}
.r-ren{background:var(--ok-l);color:var(--ok)}.r-chq{background:var(--brass-l);color:var(--brass)}.r-ok{background:var(--ok-l);color:var(--ok)}
.ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row.col .ra{margin-top:10px}
.mini{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;cursor:pointer;color:var(--t2)}
.mini.ok{background:var(--ok-l);border-color:transparent;color:var(--ok)}.mini.bad{background:var(--late-l);border-color:transparent;color:var(--late)}
.dis{width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--t3);cursor:pointer;font-size:14px}
.bal{text-align:left;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal small{display:block;font-size:12px;font-weight:600;color:var(--t3)}
.is-late{color:var(--late)}.is-adv{color:var(--ok)}
.owe{color:var(--late);font-size:12.5px;font-weight:700;margin-top:10px}.adv{color:var(--ok);font-size:12.5px;font-weight:700;margin-top:10px}
.nudge{display:block;width:100%;margin-top:18px;padding:12px;border-radius:var(--r2);border:1px dashed var(--brass);background:var(--brass-l);color:var(--t1);font-size:12.5px;font-weight:600;cursor:pointer}

/* properties */
.bar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:15px;margin-bottom:12px;cursor:pointer}
.pc header{display:flex;align-items:center;gap:11px}
.pt{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#F0C75E;display:grid;place-items:center;flex-shrink:0}
html[data-theme="dark"] .pt{background:#22324F}
.pn{flex:1;min-width:0}.pn h4{font-size:15px;font-weight:800}.pn p{font-size:12.5px;color:var(--t2)}
.pr{text-align:left}.pr b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}.pr small{font-size:12px;color:var(--t3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:8px;background:var(--line);color:var(--t2);vertical-align:middle}
.chip.brass{background:var(--brass-l);color:var(--brass)}.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bad{background:var(--late-l);color:var(--late)}.chip.warn{background:var(--warn-l);color:var(--warn)}
.st-paid{background:var(--ok-l);color:var(--ok)}.st-partial{background:var(--warn-l);color:var(--warn)}.st-late{background:var(--late-l);color:var(--late)}.st-upcoming{background:var(--line);color:var(--t2)}
/* signature: month stamp strip */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:13px}
.strip i{font-style:normal;height:30px;border-radius:7px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--t3);background:transparent;border:1px dashed var(--line)}
.strip .c-paid{background:var(--ok);border:0;color:#fff}
.strip .c-partial{background:linear-gradient(0deg,var(--warn) 50%,var(--warn-l) 50%);border:0;color:var(--t1)}
.strip .c-late{background:var(--late-l);border:1.5px solid var(--late);color:var(--late)}
.strip .c-upcoming{border:1px solid var(--line);color:var(--t2);background:var(--paper)}
.strip .c-none{opacity:.45}
.strip .now{box-shadow:0 0 0 2px var(--brass)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--t2);margin:0 2px 12px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
.legend .c-paid{background:var(--ok)}.legend .c-partial{background:var(--warn)}.legend .c-late{background:var(--late-l);border:1.5px solid var(--late)}.legend .c-upcoming{border:1px solid var(--t3)}

/* reports */
.yr{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.yr button{width:34px;height:32px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--t2)}
.yr b{min-width:52px;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div,.aging div{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px}
.kpis small,.aging small{display:block;font-size:12.5px;color:var(--t2)}
.kpis b,.aging b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.aging{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aging .is-late b{color:var(--late)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r1)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--t2);font-weight:700;text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}td small{display:block;font-size:12px;color:var(--t3)}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;margin-top:9px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--t1);position:relative}
.btn.pri{background:var(--pri);color:var(--pri-t);border-color:transparent}
.btn.danger{color:var(--late);border-color:var(--late-l)}
.btn.sm{width:auto;margin:0;padding:8px 14px;font-size:13px}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.acts .btn{margin-top:8px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer}
.seg button.on{background:var(--pri);color:var(--pri-t)}
.seg.yrs{margin:14px 0 10px}

.cdot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}.cdot.on{background:#43C084;box-shadow:0 0 0 3px rgba(67,192,132,.25)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(8,14,26,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--sb));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
.sh-h h2{font-size:18px;font-weight:800}.sh-h p{font-size:12.5px;color:var(--t2)}
.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;flex-shrink:0;color:var(--t2)}
.f{display:block;margin-bottom:11px}
.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:5px}
.f small{display:block;font-size:12px;color:var(--t3);margin-top:4px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brass)}
.err{border-color:var(--late)!important;background:var(--late-l)!important}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.dt{display:grid;grid-template-columns:.7fr 1.5fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0 12px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
.divider{height:1px;background:var(--line);margin:18px 0 14px}
.ctr{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.9}
.stbal{background:var(--card);border:1px solid var(--line);border-radius:var(--r1);padding:14px 16px;margin-bottom:4px}
.stbal small{font-size:12px;color:var(--t2);display:block}.stbal b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stbal.is-late b{color:var(--late)}.stbal.is-adv b{color:var(--ok)}
.empty{text-align:center;padding:48px 10px}.empty h3{font-size:18px;margin-bottom:6px}.empty p{color:var(--t2);font-size:13.5px;margin-bottom:14px}

/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--sb));z-index:40}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;border-radius:12px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--t1);font-weight:800}
.tabs button.on svg{stroke:var(--brass)}
#toast{position:fixed;bottom:calc(92px + var(--sb));left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
html[data-theme="dark"] #toast{background:#2A3A5C}
</style>
</head>
<body>
<header class="hdr">
  <img src="icon-192.png" alt="">
  <div><h1>املاک</h1><p id="hdate">دفتر اجاره و مطالبات</p></div>
  <div class="sp"></div>
  <span id="hcloud" class="cdot" title="پشتیبان ابری"></span>
  <button class="ibtn" onclick="openSettings()" aria-label="تنظیمات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs"><div>
  <button data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>امروز</button>
  <button data-t="props" onclick="go('props')"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-5h4v5"/></svg>املاک</button>
  <button data-t="tenants" onclick="go('tenants')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M21.5 20a6.5 6.5 0 00-4-6"/></svg>مستأجران</button>
  <button data-t="cheques" onclick="go('cheques')"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 14h6M15 10h3"/></svg>چک‌ها</button>
  <button data-t="reports" onclick="go('reports')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>گزارش</button>
</div></nav>
<div id="ov" class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ============================================================
// «املاک» — rent receivables ledger. CORE (DOM-free).
// Conventions (all internal months are 0-based):
//   • First rent is due ONE month after contract start, on the start day.
//   • Each rent month is a CHARGE (debit); payments are CREDITS allocated
//     FIFO to the oldest charge. Balance = Σ due charges − Σ payments.
//   • A rent cheque becomes a payment on its CLEARING date (prudence).
//   • Guarantee cheques are never payments.
//   • Partner settlement is on a CASH basis per Jalali year.
// ============================================================
const APP_VERSION='v1.3';
const FA='۰۱۲۳۴۵۶۷۸۹';
const MFA=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const MSH=['فرو','ارد','خرد','تیر','مرد','شهر','مهر','آبا','آذر','دی','بهم','اسف'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const DEFAULT_SMS='{نام} گرامی، سلام. اجاره {ماه} {ملک} به مبلغ {مبلغ} تومان در تاریخ {سررسید} سررسید {وضعیت}. لطفاً نسبت به پرداخت اقدام فرمایید. با سپاس';

function toFa(s){return String(s).replace(/[0-9]/g,d=>FA[d]);}
function esc(s){return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nf(n){const r=Math.round(n||0);const w=Math.abs(r).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'٬');return toFa((r<0?'-':'')+w);}
function normDigits(s){return String(s==null?'':s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));}
function toLn(s){return parseFloat(normDigits(s).replace(/[,،٬\s]/g,''))||0;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

// ---------------- Jalali calendar ----------------
function gToJ(gy,gm,gd){
  const g=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const g2=gm>2?gy+1:gy;
  let d=(365*gy)+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+g[gm-1];
  jy+=33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;
  if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365;}
  const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30);
  const jd=1+(d<186?d%31:(d-186)%30);
  return{y:jy,m:jm,d:jd};
}
// Jalali → UTC Date, verified against gToJ (returns null for an impossible date)
function jToG(jy,jm0,jd){
  const off=(jm0<6?jm0*31:186+(jm0-6)*30)+(jd-1);
  const base=Date.UTC(jy+621,2,21)+off*864e5;
  for(const k of [0,-1,1,-2,2,-3,3,-4,4]){
    const dt=new Date(base+k*864e5);
    const j=gToJ(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
    if(j.y===jy&&j.m===jm0+1&&j.d===jd) return dt;
  }
  return null;
}
function jMonthLen(y,m0){if(m0<6)return 31;if(m0<11)return 30;return jToG(y,11,30)?30:29;}
function dayNum(d){const g=jToG(d.y,d.m,Math.min(d.d,jMonthLen(d.y,d.m)));return Math.round(g.getTime()/864e5);}
function fromDayNum(n){const g=new Date(n*864e5);const j=gToJ(g.getUTCFullYear(),g.getUTCMonth()+1,g.getUTCDate());return{y:j.y,m:j.m-1,d:j.d};}
function addDays(d,n){return fromDayNum(dayNum(d)+n);}
function cmpD(a,b){return (a.y-b.y)||(a.m-b.m)||(a.d-b.d);}
let NOW_OVERRIDE=null; // tests only
function today(){
  if(NOW_OVERRIDE) return {...NOW_OVERRIDE};
  const n=new Date();const j=gToJ(n.getFullYear(),n.getMonth()+1,n.getDate());
  return{y:j.y,m:j.m-1,d:j.d,wd:WD[n.getDay()]};
}
function tIdx(d){d=d||today();return d.y*12+d.m;}
function fmtD(d){return d?`${toFa(d.d)} ${MFA[d.m]} ${toFa(d.y)}`:'—';}
function fmtM(idx){return `${MFA[idx%12]} ${toFa(Math.floor(idx/12))}`;}

// ---------------- State ----------------
function def(){return{
  schemaVersion:1,
  properties:[],tenants:[],contracts:[],payments:[],cheques:[],settlements:[],
  settings:{remindDays:2,smsTpl:DEFAULT_SMS,theme:'auto',lastBackup:null},
  dismissed:{},bridge:[],bridgeDone:{}
};}
let ST=def();
// Defaults only FILL missing keys; saved values always win (schemaVersion explicit).
function normalize(s){
  const o=Object.assign(def(),s||{});
  o.settings=Object.assign(def().settings,(s&&s.settings)||{});
  ['properties','tenants','contracts','payments','cheques','settlements'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
  if(!o.dismissed||typeof o.dismissed!=='object') o.dismissed={};
  if(!Array.isArray(o.bridge)) o.bridge=[];
  if(!o.bridgeDone||typeof o.bridgeDone!=='object') o.bridgeDone={};
  o.schemaVersion=(s&&s.schemaVersion)||1;
  return o;
}

// ---------------- Lookups ----------------
const byId=(a,id)=>a.find(x=>x.id===id)||null;
function propOf(id){return byId(ST.properties,id);}
function tenOf(id){return byId(ST.tenants,id);}
function ctrOf(id){return byId(ST.contracts,id);}
function contractsOfProp(pid){return ST.contracts.filter(c=>c.propertyId===pid);}
function activeContractOf(pid){const a=contractsOfProp(pid).filter(c=>c.status==='active');return a[a.length-1]||null;}
function activeContracts(){return ST.contracts.filter(c=>c.status==='active');}
function paymentsOf(cid){return ST.payments.filter(p=>p.contractId===cid).sort((a,b)=>cmpD(a.date,b.date)||(a.id<b.id?-1:1));}

// ---------------- Contract schedule ----------------
function pFirst(p){return p.sy*12+p.sm+1;}
function pLast(p){return p.sy*12+p.sm+(p.dur||12);}
function lastIdx(c){let mx=-1;(c.periods||[]).forEach(p=>{mx=Math.max(mx,pLast(p));});if(c.endIdx!=null)mx=Math.min(mx,c.endIdx);return mx;}
function charges(c){
  const li=lastIdx(c),out=[];
  (c.periods||[]).forEach(p=>{
    for(let i=1;i<=(p.dur||12);i++){
      const idx=p.sy*12+p.sm+i; if(idx>li) break;
      const y=Math.floor(idx/12),m=idx%12;
      out.push({idx,y,m,d:Math.min(p.sd||1,jMonthLen(y,m)),amount:p.rent||0});
    }
  });
  return out.sort((a,b)=>a.idx-b.idx);
}
function currentRent(c){
  const ch=charges(c);if(!ch.length)return 0;
  const cur=ch.find(x=>x.idx===tIdx());return cur?cur.amount:ch[ch.length-1].amount;
}
function needsRenewal(c,asOf){return c.status==='active'&&tIdx(asOf)>=lastIdx(c);}

// FIFO ledger. `cover[paymentId]` = charge idx list the payment settled.
function ledger(c,asOf){
  asOf=asOf||today();
  const ch=charges(c).map(x=>({...x,paid:0,due:cmpD(x,asOf)<=0}));
  const pays=paymentsOf(c.id);
  const cover={};let ci=0,credit=0,totalPaid=0;
  pays.forEach(p=>{
    let rem=p.amount;totalPaid+=p.amount;cover[p.id]=[];
    while(rem>0&&ci<ch.length){
      const x=ch[ci];const a=Math.min(x.amount-x.paid,rem);
      if(a>0){x.paid+=a;rem-=a;cover[p.id].push(x.idx);}
      if(x.paid>=x.amount)ci++;
    }
    credit+=rem;
  });
  ch.forEach(x=>{x.status=x.paid>=x.amount?'paid':x.paid>0?'partial':(x.due?'late':'upcoming');});
  const dueTotal=ch.filter(x=>x.due).reduce((s,x)=>s+x.amount,0);
  return{charges:ch,totalPaid,dueTotal,balance:dueTotal-totalPaid,credit,cover};
}
function aging(c,asOf){
  asOf=asOf||today();const L=ledger(c,asOf);const b={a:0,b:0,c:0};
  L.charges.forEach(x=>{
    if(!x.due)return;const rem=x.amount-x.paid;if(rem<=0)return;
    const days=dayNum(asOf)-dayNum(x);
    if(days<=30)b.a+=rem;else if(days<=60)b.b+=rem;else b.c+=rem;
  });
  return b;
}

// ---------------- Mutations (return value or throw Error with Persian msg) ----------------
function addPayment({contractId,amount,date,method,note,chequeId}){
  if(!ctrOf(contractId)) throw new Error('قرارداد یافت نشد');
  if(!(amount>0)) throw new Error('مبلغ باید بزرگتر از صفر باشد');
  if(!date) throw new Error('تاریخ نامعتبر است');
  const p={id:uid(),contractId,date,amount,method:method||'transfer',chequeId:chequeId||null,note:note||'',legacyPeriod:null};
  ST.payments.push(p);return p;
}
function delPayment(id){
  const p=byId(ST.payments,id);if(!p)return;
  ST.payments=ST.payments.filter(x=>x.id!==id);
  if(p.chequeId){const q=byId(ST.cheques,p.chequeId);if(q){q.status='pending';q.statusDate=null;q.paymentId=null;}}
}
const CHQ_OK={rent:['pending','cleared','bounced'],guarantee:['held','returned']};
function setChequeStatus(id,status,date){
  const q=byId(ST.cheques,id);if(!q) throw new Error('چک یافت نشد');
  if(!CHQ_OK[q.kind].includes(status)) throw new Error('وضعیت نامعتبر');
  if(q.kind==='rent'){
    if(status==='cleared'&&!q.paymentId){
      const p=addPayment({contractId:q.contractId,amount:q.amount,date:date||q.due,method:'cheque',chequeId:q.id,note:'چک '+(q.number||'')});
      q.paymentId=p.id;
    }
    if(status!=='cleared'&&q.paymentId){ST.payments=ST.payments.filter(p=>p.id!==q.paymentId);q.paymentId=null;}
  }
  q.status=status;q.statusDate=(status==='pending'||status==='held')?null:(date||today());
}
function delCheque(id){
  const q=byId(ST.cheques,id);if(!q)return;
  if(q.paymentId) ST.payments=ST.payments.filter(p=>p.id!==q.paymentId);
  ST.cheques=ST.cheques.filter(x=>x.id!==id);
}
function delContract(cid){
  ST.payments=ST.payments.filter(p=>p.contractId!==cid);
  ST.cheques=ST.cheques.filter(q=>q.contractId!==cid);
  ST.contracts=ST.contracts.filter(c=>c.id!==cid);
}
function delProperty(pid){contractsOfProp(pid).forEach(c=>delContract(c.id));ST.properties=ST.properties.filter(p=>p.id!==pid);}

// ---------------- Reminders ----------------
function reminders(asOf){
  asOf=asOf||today();
  const win=ST.settings.remindDays||0,lim=addDays(asOf,win),ai=tIdx(asOf),items=[];
  activeContracts().forEach(c=>{
    const L=ledger(c,asOf);
    const late=L.charges.filter(x=>x.due&&x.paid<x.amount);
    if(late.length) items.push({key:`late_${c.id}_${ai}`,type:'late',cid:c.id,amount:L.balance,first:late[0],count:late.length,days:dayNum(asOf)-dayNum(late[0])});
    else{
      const up=L.charges.find(x=>!x.due&&x.paid<x.amount&&cmpD(x,lim)<=0);
      if(up) items.push({key:`up_${c.id}_${up.idx}`,type:'upcoming',cid:c.id,amount:up.amount-up.paid,first:up,days:dayNum(up)-dayNum(asOf)});
    }
    if(needsRenewal(c,asOf)) items.push({key:`renew_${c.id}_${lastIdx(c)}_${ai}`,type:'renew',cid:c.id,last:lastIdx(c)});
  });
  ST.cheques.filter(q=>q.kind==='rent'&&q.status==='pending'&&cmpD(q.due,lim)<=0).forEach(q=>{
    const days=dayNum(q.due)-dayNum(asOf);
    items.push({key:`chq_${q.id}_${days<0?'late':'up'}`,type:'cheque',qid:q.id,cid:q.contractId,amount:q.amount,days});
  });
  const live=new Set(items.map(i=>i.key));
  Object.keys(ST.dismissed).forEach(k=>{if(!live.has(k))delete ST.dismissed[k];}); // self-cleaning
  return items.filter(i=>!ST.dismissed[i.key]);
}
function smsText(cid,asOf){
  asOf=asOf||today();
  const c=ctrOf(cid),t=tenOf(c.tenantId),p=propOf(c.propertyId),L=ledger(c,asOf);
  const late=L.charges.filter(x=>x.due&&x.paid<x.amount);
  const ref=late[0]||L.charges.find(x=>x.paid<x.amount);
  if(!ref) return '';
  const amount=late.length?L.balance:ref.amount-ref.paid;
  const months=late.length>1?late.map(x=>MFA[x.m]).join('، '):MFA[ref.m]+' '+toFa(ref.y);
  return (ST.settings.smsTpl||DEFAULT_SMS)
    .replace(/{نام}/g,t?t.name:'').replace(/{ملک}/g,p?p.name:'')
    .replace(/{مبلغ}/g,nf(amount)).replace(/{ماه}/g,months)
    .replace(/{سررسید}/g,fmtD(ref)).replace(/{وضعیت}/g,late.length?'شده است':'می‌شود');
}

// ---------------- Property & portfolio metrics ----------------
function collectedCash(pid,y){
  return ST.payments.reduce((s,p)=>{const c=ctrOf(p.contractId);return s+((c&&c.propertyId===pid&&p.date.y===y)?p.amount:0);},0);
}
function yields(pid,y){
  const p=propOf(pid),c=activeContractOf(pid);
  if(!p||!(p.value>0)||!c) return null;
  const rent=currentRent(c)*12;
  return{
    gross:rent/p.value*100,
    eff:(c.deposit>0&&p.value>c.deposit)?rent/(p.value-c.deposit)*100:null,
    real:collectedCash(pid,y)/p.value*100
  };
}
function partnerBalances(y){
  const map={};const get=n=>map[n]||(map[n]={partner:n,fromPartner:0,toPartner:0,settledIn:0,settledOut:0,props:[]});
  ST.properties.forEach(p=>{
    if(!(p.myShare<100)||!(p.partner||'').trim()) return;
    const col=collectedCash(p.id,y),s=p.myShare/100,r=get(p.partner.trim());
    r.props.push(p.name);
    if(p.collector==='partner') r.fromPartner+=col*s; else r.toPartner+=col*(1-s);
  });
  ST.settlements.filter(x=>x.year===y).forEach(x=>{const r=get((x.partner||'').trim());if(x.dir==='in')r.settledIn+=x.amount;else r.settledOut+=x.amount;});
  return Object.values(map).map(r=>({...r,net:Math.round(r.fromPartner-r.toPartner-r.settledIn+r.settledOut)}));
}
function depositsHeld(){return ST.contracts.filter(c=>c.deposit>0&&c.depReceived&&!c.depReturned);}

// ---------------- Calendar export (.ics) ----------------
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildICS(asOf){
  asOf=asOf||today();
  const n=Math.max(0,ST.settings.remindDays||0);
  const pre=n>=1?`-P${n-1}DT15H`:'PT9H'; // 09:00, n days before (all-day event)
  const ymd=d=>{const g=jToG(d.y,d.m,d.d);return g.getUTCFullYear()+String(g.getUTCMonth()+1).padStart(2,'0')+String(g.getUTCDate()).padStart(2,'0');};
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Amlak//FA','CALSCALE:GREGORIAN','X-WR-CALNAME:املاک'];
  const ev=(uidv,d,sum,desc)=>{L.push('BEGIN:VEVENT',`UID:${uidv}@amlak`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ymd(d)}`,`DTEND;VALUE=DATE:${ymd(addDays(d,1))}`,
    `SUMMARY:${icsEsc(sum)}`,`DESCRIPTION:${icsEsc(desc)}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(sum)}`,`TRIGGER:${pre}`,'END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(sum)}`,'TRIGGER:PT9H','END:VALARM','END:VEVENT');};
  let count=0;const horizon=tIdx(asOf)+12;
  activeContracts().forEach(c=>{
    const p=propOf(c.propertyId),t=tenOf(c.tenantId);
    ledger(c,asOf).charges.forEach(x=>{
      if(x.paid>=x.amount||x.idx>horizon||x.idx<tIdx(asOf)) return;
      ev(`r-${c.id}-${x.idx}`,x,`اجاره ${p?p.name:''} (${t?t.name:''})`,`مبلغ: ${nf(x.amount-x.paid)} تومان`);count++;
    });
  });
  ST.cheques.filter(q=>q.kind==='rent'&&q.status==='pending'&&cmpD(q.due,asOf)>=0).forEach(q=>{
    const c=ctrOf(q.contractId),t=c?tenOf(c.tenantId):null;
    ev(`q-${q.id}`,q.due,`سررسید چک ${t?t.name:''}`,`مبلغ: ${nf(q.amount)} تومان، شماره ${q.number||'—'}`);count++;
  });
  L.push('END:VCALENDAR');
  return{text:L.join('\r\n'),count};
}

// ---------------- Import from «سرمایه» ----------------
function importSarmaye(data){
  if(!data||data.type!=='sarmaye-rent-export') throw new Error('این فایل، خروجی اجارهٔ «سرمایه» نیست');
  const S=def();S.settings=Object.assign({},ST.settings);
  (data.properties||[]).forEach(p=>S.properties.push({id:p.id,name:p.name||p.unit||'ملک',address:p.address||'',
    type:p.type==='commercial'?'com':'res',value:+p.value||0,myShare:100,collector:'me',partner:'',note:p.note||''}));
  (data.tenants||[]).forEach(t=>S.tenants.push({id:t.id,name:t.name||'',phone:t.phone||'',note:t.note||''}));
  (data.rentalContracts||[]).forEach(c=>{
    const term=c.status==='terminated';
    const ta=c.terminatedAt&&typeof c.terminatedAt==='object'&&c.terminatedAt.y?c.terminatedAt:null;
    S.contracts.push({id:c.id,propertyId:c.propertyId,tenantId:c.tenantId,
      periods:(c.periods||[]).map(p=>({sd:+p.sd||1,sm:+p.sm||0,sy:+p.sy,dur:+p.dur||12,rent:+p.rent||0})),
      deposit:+c.deposit||0,depReceived:c.depositReceivedDate||null,depReturned:c.depositReturnedDate||null,
      status:term?'ended':'active',endIdx:ta?ta.y*12+ta.m:null,note:c.note||''});
  });
  let skipped=0;
  (data.rentPayments||[]).forEach(p=>{
    if(!S.contracts.some(c=>c.id===p.contractId)||!(+p.amount>0)){skipped++;return;}
    const date=p.payDate&&p.payDate.y?p.payDate:(p.rentPeriod?{y:p.rentPeriod.y,m:p.rentPeriod.m,d:1}:null);
    if(!date){skipped++;return;}
    S.payments.push({id:p.id||uid(),contractId:p.contractId,date,amount:+p.amount,method:'',chequeId:null,note:p.note||'',legacyPeriod:p.rentPeriod||null});
  });
  const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
  const src={props:(data.properties||[]).length,tenants:(data.tenants||[]).length,contracts:(data.rentalContracts||[]).length,
    payments:(data.rentPayments||[]).length,paySum:sum(data.rentPayments||[],x=>x.amount),depSum:sum(data.rentalContracts||[],x=>x.deposit)};
  const dst={props:S.properties.length,tenants:S.tenants.length,contracts:S.contracts.length,
    payments:S.payments.length,paySum:sum(S.payments,x=>x.amount),depSum:sum(S.contracts,x=>x.deposit)};
  const ok=src.props===dst.props&&src.tenants===dst.tenants&&src.contracts===dst.contracts&&src.payments===dst.payments&&src.paySum===dst.paySum&&src.depSum===dst.depSum;
  return{state:S,rec:{src,dst,ok,skipped}};
}

// ---------------- Bridge from «سرمایه» (rent deposits detected in bank SMS) ----------------
// Rank active contracts for an incoming amount: exact arrears match, then exact
// next-due match, then exact current rent, then the rest.
function bridgeCandidates(amount,asOf){
  return activeContracts().map(c=>{
    const L=ledger(c,asOf);const next=L.charges.find(x=>x.paid<x.amount);
    const nextDue=next?next.amount-next.paid:0;
    const score=(L.balance===amount?3:0)+(nextDue===amount?2:0)+(currentRent(c)===amount?1:0);
    return{c,score,balance:L.balance,nextDue};
  }).sort((a,b)=>b.score-a.score||b.balance-a.balance);
}

// ---------------- Month strip (signature element) ----------------
function strip(c,y){
  if(!c) return '';
  const L=ledger(c),map={};L.charges.forEach(x=>map[x.idx]=x);
  const ci=tIdx();
  return `<div class="strip" role="img" aria-label="وضعیت ماه‌های ${toFa(y)}">${MSH.map((s,m)=>{
    const x=map[y*12+m];const st=x?x.status:'none';
    return `<i class="c-${st}${y*12+m===ci?' now':''}" title="${MFA[m]}${x?': '+nf(x.paid)+' از '+nf(x.amount):''}">${s}</i>`;}).join('')}</div>`;
}

// ---------------- Render root ----------------
function render(){

  const v={today:vToday,props:vProps,tenants:vTenants,cheques:vCheques,reports:vReports}[TAB]();
  $('view').innerHTML=v;
}

function itemRow(it){

    <div class="ra"><button class="mini ok" onclick="openPay('${it.cid}')">ثبت پرداخت</button><button class="mini" onclick="sendSms('${it.cid}')">پیامک</button>${x}</div></div>`;
  if(it.type==='upcoming') return `<div class="row"><span class="ri r-up">${svg('upcoming')}</span><div class="rb"><b>${who}</b><small>${nf(it.amount)} تومان، ${it.days===0?'سررسید امروز':toFa(it.days)+' روز دیگر'} (${fmtD(it.first)})</small></div>
    <div class="ra"><button class="mini ok" onclick="openPay('${it.cid}')">ثبت پرداخت</button><button class="mini" onclick="sendSms('${it.cid}')">پیامک</button>${x}</div></div>`;

    <div class="ra"><button class="mini ok" onclick="openRenew('${it.cid}')">تمدید</button>${x}</div></div>`;

const CHQ_ST={pending:['در جریان','warn'],cleared:['وصول‌شده','ok'],bounced:['برگشتی','bad'],held:['نزد من','brass'],returned:['عودت‌شده','']};
function vCheques(){
  const all=ST.cheques.slice().sort((a,b)=>cmpD(a.due,b.due));

      <div class="ra">${acts}<button class="mini" onclick="openCheque('${q.id}')">ویرایش</button></div></div>`;}).join('')}</div>`:`<p class="calm">${CHQ_F==='open'?'چک بازی ندارید.':'چکی ثبت نشده است.'}</p>`}`;

async function chqAct(id,st){
  try{
    let d=today();
    if(st==='cleared'){const q=byId(ST.cheques,id);if(q&&cmpD(q.due,d)>0)d=q.due;}
    setChequeStatus(id,st,d);await sv();ntf({cleared:'چک وصول و به‌عنوان پرداخت ثبت شد',bounced:'چک برگشتی ثبت شد',pending:'چک به حالت در جریان برگشت',returned:'عودت چک ثبت شد',held:'چک نزد شما ثبت شد'}[st]);render();
  }catch(e){ntf(e.message);}
}

async function saveProp(id){
  const name=val('p_name').trim();if(!name)return errIn('p_name','نام ملک را وارد کنید');
  const share=toLn(val('p_share'));if(!(share>0&&share<=100))return errIn('p_share','سهم باید بین ۱ تا ۱۰۰ باشد');
  const partner=val('p_partner').trim();if(share<100&&!partner)return errIn('p_partner','برای ملک مشاع، نام شریک را وارد کنید');
  const rec={name,address:val('p_addr').trim(),type:val('p_type'),value:toLn(val('p_val')),myShare:share,partner:share<100?partner:'',collector:share<100?val('p_col'):'me'};
  let pid=id;
  if(id) Object.assign(propOf(id),rec); else {pid=uid();ST.properties.push({id:pid,note:'',...rec});}
  await sv();ntf('ملک ذخیره شد');render();openProp(pid);
}
function askDelProp(id){

async function saveContract(pid,cid){
  const s=readDate('c_start');if(!s)return errIn('c_start','تاریخ شروع نامعتبر است');
  const rent=toLn(val('c_rent'));if(!(rent>0))return errIn('c_rent','اجارهٔ ماهانه را وارد کنید');
  const dur=parseInt(normDigits(val('c_dur')));if(!(dur>=1&&dur<=60))return errIn('c_dur','مدت باید بین ۱ تا ۶۰ ماه باشد');
  const dep=toLn(val('c_dep'));let depReceived=null;
  if($('c_depok').checked){depReceived=readDate('c_depdate');if(!depReceived)return errIn('c_depdate','تاریخ دریافت ودیعه نامعتبر است');}
  const per={sd:s.d,sm:s.m,sy:s.y,dur,rent};
  if(cid){
    const c=ctrOf(cid);
    if(c.periods.length>1&&pFirst(per)<=pLast(c.periods[c.periods.length-2]))return errIn('c_start','دورهٔ جاری با دورهٔ قبلی هم‌پوشانی دارد');
    c.periods[c.periods.length-1]=per;c.deposit=dep;c.depReceived=depReceived;
    c.depReturned=$('c_depret')&&$('c_depret').checked?(c.depReturned||today()):null;
  }else{
    if(activeContractOf(pid))return ntf('این ملک قرارداد فعال دارد؛ ابتدا آن را پایان دهید');
    let tid=val('c_ten');
    if(tid==='__new'){const n=val('c_tname').trim();if(!n)return errIn('c_tname','نام مستأجر را وارد کنید');
      tid=uid();ST.tenants.push({id:tid,name:n,phone:normDigits(val('c_tphone')).trim(),note:''});}
    ST.contracts.push({id:uid(),propertyId:pid,tenantId:tid,periods:[per],deposit:dep,depReceived,depReturned:null,status:'active',endIdx:null,note:''});
  }
  await sv();ntf('قرارداد ذخیره شد');render();openProp(pid);
}

  const years=[...new Set(L.charges.map(x=>x.y))];y=y||(years.includes(today().y)?today().y:years[years.length-1]);

  <div class="stbal ${L.balance>0?'is-late':L.balance<0?'is-adv':''}"><small>${L.balance>0?'بدهکار':L.balance<0?'بستانکار (پیش‌پرداخت)':'حساب تسویه است'}</small><b>${nf(Math.abs(L.balance))}</b></div>

  <div class="tbl"><table><thead><tr><th>ماه</th><th>اجاره</th><th>پرداخت‌شده</th><th>وضعیت</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${MFA[x.m]}<small>سررسید ${toFa(x.d)}ام</small></td><td>${nf(x.amount)}</td><td>${nf(x.paid)}</td><td><span class="chip st-${x.status}">${stL[x.status]}</span></td></tr>`).join('')||'<tr><td colspan="4">—</td></tr>'}

function openPay(cid){
  const c=ctrOf(cid);const L=ledger(c);

  const suggest=L.balance>0?L.balance:(next?next.amount-next.paid:currentRent(c));

  ${field('مبلغ (تومان)',money('y_amt',suggest),L.balance>0?`معوق فعلی ${nf(L.balance)} تومان`:next?`اجارهٔ بعدی: ${MFA[next.m]}`:'')}
  ${field('تاریخ دریافت',dateIn('y_date',today()))}
  ${field('روش',`<select id="y_m"><option value="transfer">کارت/واریز</option><option value="cash">نقد</option></select>`,'برای چک، از صفحهٔ چک‌ها ثبت کنید؛ با وصول، خودکار پرداخت می‌شود')}
  ${field('یادداشت','<input id="y_note">')}
  <button class="btn pri" onclick="savePay('${cid}')">ثبت پرداخت</button>`);
}

function sendSms(cid){

async function saveCheque(id){
  const amount=toLn(val('q_a'));if(!(amount>0))return errIn('q_a','مبلغ را وارد کنید');

// ---------------- Images: receipt & statement (canvas → share) ----------------
async function canvasShare(cv,name,title){
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function paperCanvas(h){
  const cv=document.createElement('canvas');cv.width=720;cv.height=h;const x=cv.getContext&&cv.getContext('2d');
  if(!x) throw new Error('این مرورگر ساخت تصویر را پشتیبانی نمی‌کند');
  x.fillStyle='#FBFAF6';x.fillRect(0,0,720,h);x.fillStyle='#15243F';x.fillRect(0,0,720,120);
  x.fillStyle='#C9A24E';x.fillRect(0,120,720,4);x.direction='rtl';x.textAlign='right';
  x.fillStyle='#F0C75E';x.font="44px Lalezar, Vazirmatn";x.fillText('املاک',672,72);
  x.fillStyle='rgba(255,255,255,.75)';x.font="500 18px Vazirmatn";x.fillText('دفتر اجاره و مطالبات',672,102);
  return{cv,x};
}
function kv(x,y,k,v,big){x.textAlign='right';x.fillStyle='#6B7589';x.font="500 20px Vazirmatn";x.fillText(k,672,y);
  x.textAlign='left';x.fillStyle='#16202E';x.font=(big?'800 34px':'700 22px')+' Vazirmatn';x.fillText(v,48,y);x.textAlign='right';}
async function shareReceipt(pid){try{await _shareReceipt(pid);}catch(e){ntf(e.message);}}
async function _shareReceipt(pid){
  const p=byId(ST.payments,pid);if(!p)return;const c=ctrOf(p.contractId);const L=ledger(c);
  try{await document.fonts.load('700 22px Vazirmatn');await document.fonts.load('44px Lalezar');}catch(e){}
  const {cv,x}=paperCanvas(640);
  x.fillStyle='#16202E';x.font="800 30px Vazirmatn";x.fillText('رسید دریافت اجاره',672,184);

// write: primary path, then fallback
async function cloudWrite(payload){
  const uid=cloudUser().uid;
  if(ST.settings.cloudPath!=='field'){
    try{await fbDb.collection('amlak_backups').doc(uid).set(payload);ST.settings.cloudPath='doc';return;}
    catch(e){if(!isDenied(e))throw e;}
  }
  await fbDb.collection('backups').doc(uid).set({amlak:payload},{merge:true});ST.settings.cloudPath='field';
}
async function cloudRead(){
  const uid=cloudUser().uid;
  try{const d=await fbDb.collection('amlak_backups').doc(uid).get();if(d.exists&&d.data().data)return d.data();}
  catch(e){if(!isDenied(e))throw e;}
  const d=await fbDb.collection('backups').doc(uid).get();
  return d.exists&&d.data().amlak?d.data().amlak:null;
}

const b2s=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
const s2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ghKey(pass,salt,use){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:50000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use]);}
async function ghEnc(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ghKey(pass,salt,'encrypt'),new TextEncoder().encode(JSON.stringify(obj)));
  return{amlakEnc:1,salt:b2s(salt),iv:b2s(iv),data:b2s(ct)};}
async function ghDec(e,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(e.iv)},await ghKey(pass,s2b(e.salt),'decrypt'),s2b(e.data));return JSON.parse(new TextDecoder().decode(pt));}
function ghFetch(path,opt){const c=ghCfg();opt=opt||{};
  const h={'Authorization':'Bearer '+c.token,'Accept':opt.accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+path,{method:opt.method||'GET',cache:'no-store',headers:h,body:opt.body});}
function ghErr(r){return r.status===401?'توکن نامعتبر یا منقضی است':r.status===403?'توکن اجازهٔ نوشتن در این ریپو را ندارد':r.status===404?'ریپو پیدا نشد یا توکن به آن دسترسی ندارد':'خطای GitHub ('+r.status+')';}
async function ghBackup(silent){
  if(!ghOn()||ghBusy)return false;ghBusy=true;const c=ghCfg();
  try{const payload=JSON.stringify(c.pass?await ghEnc(ST,c.pass):ST);
    let sha;const g=await ghFetch('/contents/'+GH_FILE);if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(ghErr(g));
    const t=today();const p=await ghFetch('/contents/'+GH_FILE,{method:'PUT',body:JSON.stringify({message:`املاک ${t.y}/${t.m+1}/${t.d} ${new Date().toTimeString().slice(0,5)} — ${APP_VERSION}`,content:b2s(new TextEncoder().encode(payload)),sha})});
    if(!p.ok)throw new Error(ghErr(p));
    localStorage.setItem(GH_LAST,String(Date.now()));const el=$('gh-status');if(el)el.textContent=ghStatusText();
    if(!silent)ntf('پشتیبان در GitHub ذخیره شد');return true;
  }catch(e){if(!silent)ntf('پشتیبان GitHub: '+(e.message||'اتصال برقرار نشد'));return false;}finally{ghBusy=false;}}
// v1.3: «سرمایه» drops rent deposits into amlak-inbox.json in the same private repo
async function ghInboxRead(){
  const g=await ghFetch('/contents/amlak-inbox.json');if(g.status===404)return{sha:null,data:{items:{}}};
  if(!g.ok)throw new Error(ghErr(g));const j=await g.json();let data={items:{}};
  try{data=JSON.parse(new TextDecoder().decode(s2b(j.content.replace(/\n/g,''))));}catch(e){}
  if(!data.items)data.items={};return{sha:j.sha,data};
}
async function ghInboxRemove(id){
  for(let i=0;i<3;i++){const {sha,data}=await ghInboxRead();if(!data.items[id])return true;delete data.items[id];
    const p=await ghFetch('/contents/amlak-inbox.json',{method:'PUT',body:JSON.stringify({message:'صندوق املاک — ثبت شد',content:b2s(new TextEncoder().encode(JSON.stringify(data))),sha})});
    if(p.ok)return true;if(p.status!==409&&p.status!==422)return false;}
  return false;
}
function ghSchedule(){if(!ghOn())return;clearTimeout(ghTimer);ghTimer=setTimeout(()=>ghBackup(true),15000);}
function ghStatusText(){if(!ghOn())return 'غیرفعال — بدون VPN کار می‌کند';const c=ghCfg();const l=+localStorage.getItem(GH_LAST)||0;
  return `فعال — ${c.owner}/${c.repo}${c.pass?'، رمزنگاری‌شده':''}؛ `+(l?'آخرین پشتیبان '+new Date(l).toLocaleString('fa-IR'):'هنوز پشتیبانی ثبت نشده');}
function openGhSheet(){
  let c=ghCfg();if(!c.token){try{const s=JSON.parse(localStorage.getItem('srm_gh_cfg')||'{}');if(s.token)c={owner:s.owner,repo:s.repo,token:s.token};}catch(e){}}
  openSheet(`${sheetHead('پشتیبان GitHub','بدون VPN؛ هر پشتیبان یک نسخه در تاریخچه')}
  <details><summary class="dim" style="cursor:pointer">راهنمای یک‌باره</summary><p class="dim" style="line-height:2">همان ریپوی خصوصی و توکنی که برای «سرمایه» ساخته‌اید کافی است (املاک در فایل جداگانهٔ <code>amlak-backup.json</code> ذخیره می‌شود). اگر هنوز نساخته‌اید: ریپوی Private ← Fine-grained token فقط برای همان ریپو با Contents: Read and write.</p></details>
  ${field('نام کاربری GitHub',`<input id="gh-owner" dir="ltr" value="${esc(c.owner||'ahmadr59-ops')}">`)}
  ${field('نام ریپو',`<input id="gh-repo" dir="ltr" value="${esc(c.repo||'sarmaye-backup')}">`)}
  ${field('توکن دسترسی',`<input id="gh-token" type="password" dir="ltr" value="${esc(c.token||'')}">`,'فقط روی همین دستگاه ذخیره می‌شود')}
  ${field('رمز رمزنگاری (اختیاری)',`<input id="gh-pass" type="password" dir="ltr" value="${esc(c.pass||'')}">`,'اگر فراموش شود، پشتیبان‌ها قابل بازیابی نیستند')}
  <button class="btn pri" onclick="saveGh()">ذخیره و آزمایش اتصال</button>
  <div class="acts"><button class="btn" onclick="ghBackup(false)">پشتیبان الان</button><button class="btn" onclick="ghHist()">نسخه‌ها و بازیابی</button></div>
  <div id="gh-hist"></div>
  ${ghOn()?`<button class="btn danger" onclick="ghOff()">غیرفعال کردن روی این دستگاه</button>`:''}
  <button class="btn" onclick="openSettings()">بازگشت به تنظیمات</button>`);}
async function saveGh(){const c={owner:val('gh-owner').trim(),repo:val('gh-repo').trim(),token:val('gh-token').trim(),pass:val('gh-pass')};
  if(!c.owner||!c.repo||!c.token)return ntf('نام کاربری، ریپو و توکن را وارد کنید');
  localStorage.setItem(GH_KEY,JSON.stringify(c));ntf('آزمایش اتصال…');if(await ghBackup(false))openGhSheet();}
function ghOff(){if(!confirm('پشتیبان GitHub روی این دستگاه غیرفعال شود؟'))return;localStorage.removeItem(GH_KEY);localStorage.removeItem(GH_LAST);openSettings();}
async function ghHist(){const b=$('gh-hist');b.innerHTML='<p class="dim">در حال دریافت…</p>';
  try{const r=await ghFetch('/commits?path='+GH_FILE+'&per_page=15');if(!r.ok)throw new Error(ghErr(r));const H=await r.json();
    b.innerHTML=H.length?`<div class="list">${H.map(h=>`<button class="row tap" onclick="ghRestore('${h.sha}')"><div class="rb"><b>${esc(new Date(h.commit.committer.date).toLocaleString('fa-IR'))}</b><small>${esc(h.commit.message)}</small></div></button>`).join('')}</div>`:'<p class="dim">هنوز نسخه‌ای وجود ندارد</p>';
  }catch(e){b.innerHTML=`<p class="owe">${esc(e.message||'اتصال برقرار نشد')}</p>`;}}
async function ghRestore(sha){
  try{const r=await ghFetch('/contents/'+GH_FILE+'?ref='+sha,{accept:'application/vnd.github.raw+json'});if(!r.ok)throw new Error(ghErr(r));
    let d=JSON.parse(await r.text());
    if(d.amlakEnc===1){const pass=ghCfg().pass||prompt('رمز رمزنگاری پشتیبان:');if(!pass)return;try{d=await ghDec(d,pass);}catch(e){return ntf('رمز اشتباه است');}}
    if(!Array.isArray(d.properties)||!Array.isArray(d.contracts))return ntf('این نسخه فایل معتبر املاک نیست');
    if(!confirm('داده‌های فعلی این دستگاه با این نسخه جایگزین شود؟'))return;
    await dbSet('state_before_gh_restore',JSON.parse(JSON.stringify(ST)));
    ST=normalize(d);applyTheme();await sv(true);closeSheet();render();ntf('بازیابی از GitHub انجام شد');
  }catch(e){ntf('بازیابی GitHub: '+(e.message||'اتصال برقرار نشد'));}}

</script>
